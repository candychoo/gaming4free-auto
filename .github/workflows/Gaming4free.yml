name: Gaming4free Auto Renew

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  Renew-Gaming4free:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: ⚙ 设置 Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: 🛠️ 安装系统依赖和python依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
        pip install seleniumbase requests
        seleniumbase install chromedriver

    - name: ⚙ 设置代理 (sing-box)
      continue-on-error: true
      env:
        NODE_LINK: ${{ secrets.NODE_LINK }}
      run: |
        bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

    - name: 🚀 运行续期脚本
      env:
        SERVERS: ${{ secrets.SERVERS }}
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        IS_PROXY: "true"
        PROXY_SERVER: "http://127.0.0.1:1081"
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 gaming4free.py

    - name: 🧹 清理旧的工作流运行记录
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
        CURRENT_RUN_ID: ${{ github.run_id }}
      run: |
        PAGE=1
        DELETED=0
        TOTAL=0
        while true; do
          RUNS=$(gh run list --repo "${{ github.repository }}" --workflow="Gaming4free Auto Renew" --limit=100 --page "$PAGE" --json databaseId --jq '.[].databaseId')
          if [ -z "$RUNS" ]; then
            break
          fi
          PAGE=$((PAGE + 1))
          for RUN_ID in $RUNS; do
            if [ "$RUN_ID" = "$CURRENT_RUN_ID" ]; then
              echo "⏭️ 跳过当前运行 $RUN_ID"
              continue
            fi
            TOTAL=$((TOTAL + 1))
            echo "🗑️ 删除运行记录: $RUN_ID"
            if gh run delete --repo "${{ github.repository }}" "$RUN_ID"; then
              DELETED=$((DELETED + 1))
            fi
            sleep 0.3
          done
          # 如果拿到不满100条，说明没有更多了
          COUNT=$(echo "$RUNS" | wc -w)
          if [ "$COUNT" -lt 100 ]; then
            break
          fi
        done
        echo "📊 共找到 ${TOTAL} 条旧记录，删除 ${DELETED} 条，保留最新 1 条"
