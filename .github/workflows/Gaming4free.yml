name: Gaming4free Auto Renew

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  Renew-Gaming4free:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: ⚙ 设置 Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: 🛠️ 安装系统依赖和python依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
        pip install seleniumbase requests
        seleniumbase install chromedriver

    - name: ⚙ 设置代理 (sing-box)
      continue-on-error: true
      env:
        NODE_LINK: ${{ secrets.NODE_LINK }}
      run: |
        bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

    - name: 🚀 运行续期脚本
      env:
        SERVERS: ${{ secrets.SERVERS }}
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        IS_PROXY: "true"
        PROXY_SERVER: "http://127.0.0.1:1081"
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 gaming4free.py

    - name: 🧹 清理旧的工作流运行记录
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        RUNS=$(gh run list --repo "${{ github.repository }}" --workflow="Gaming4free Auto Renew" --limit=100 --json databaseId --jq '.[].databaseId')
        COUNT=0
        DELETED=0
        for RUN_ID in $RUNS; do
          COUNT=$((COUNT + 1))
          if [ $COUNT -gt 1 ]; then
            echo "删除运行记录: $RUN_ID"
            if gh run delete --repo "${{ github.repository }}" "$RUN_ID"; then
              DELETED=$((DELETED + 1))
            fi
            sleep 0.3
          fi
        done
        echo "共找到 ${COUNT} 条，删除 ${DELETED} 条，保留最新 1 条"
